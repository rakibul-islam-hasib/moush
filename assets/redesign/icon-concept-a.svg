<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="icon-a-title">
  <title id="icon-a-title">Moush App Icon — Concept A</title>
  <defs>
    <linearGradient id="tile-bg-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tile-rim-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="symbol-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="chevron-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft-glow-a" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Windows 11 Squircle Canvas -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#tile-bg-a)"/>
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#tile-rim-a)" stroke-width="2.5"/>
  
  <!-- Subtle Internal Radial Ambient Bloom -->
  <circle cx="256" cy="220" r="160" fill="#0284C7" opacity="0.12"/>
  
  <!-- Symbol scaled to center (256x256 inside 512x512) -->
  <g transform="translate(128, 128)" filter="url(#soft-glow-a)">
    <path fill="url(#symbol-grad-a)" fill-rule="evenodd" d="
      M 44 44
      C 37.4 44 32 49.4 32 56
      V 200
      C 32 206.6 37.4 212 44 212
      H 76
      C 82.6 212 88 206.6 88 200
      V 116
      L 128 156
      L 168 116
      V 200
      C 168 206.6 173.4 212 180 212
      H 212
      C 218.6 212 224 206.6 224 200
      V 56
      C 224 49.4 218.6 44 212 44
      H 180
      L 128 96
      L 76 44
      Z
    "/>
    <!-- Dynamic Cyan Accent on the Central Gateway Vector -->
    <path fill="url(#chevron-grad-a)" d="
      M 128 96
      L 168 116
      V 132
      L 128 156
      L 88 132
      V 116
      Z
    "/>
  </g>
</svg>

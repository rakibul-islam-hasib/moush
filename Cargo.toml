[workspace]
resolver = "3"
members = ["crates/moush-core", "crates/moush-engine", "crates/moush-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
moush-core = { path = "crates/moush-core" }
moush-engine = { path = "crates/moush-engine" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the primitives of Noise_XX_25519_ChaChaPoly_BLAKE2s. snow's default `std` feature
# also pulls in `ring` (via `ring/std`), and its default resolver adds AES-GCM and SHA-2.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
blake2 = "0.10"
if-addrs = "0.15"
windows = "0.62"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# Debug builds: the transport's crypto runs ~200x slower unoptimized (3-4 MB/s), which makes
# bulk tests slow and debug builds of the app useless for transfers. These crates are small
# and rarely rebuilt, so optimizing them costs little compile time.
[profile.dev.package.snow]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.universal-hash]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3

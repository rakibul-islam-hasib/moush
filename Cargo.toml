[workspace]
resolver = "3"
members = ["crates/moush-core", "crates/moush-engine", "crates/moush-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
moush-core = { path = "crates/moush-core" }
moush-engine = { path = "crates/moush-engine" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
blake2 = "0.10"
if-addrs = "0.15"
windows = "0.62"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

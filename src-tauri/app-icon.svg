<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="app-title">
  <title id="app-title">Mouse Share Application Icon</title>
  <defs>
    <!-- Background Canvas: Deep Midnight Navy Gradient -->
    <linearGradient id="ms-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#080E1A"/>
      <stop offset="100%" stop-color="#03060D"/>
    </linearGradient>

    <!-- Acrylic Squircle Rim (Fluent Specular Edge) -->
    <linearGradient id="ms-tile-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Left Screen (Workstation A - Source Host) -->
    <linearGradient id="ms-s1-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213D"/>
      <stop offset="100%" stop-color="#091122"/>
    </linearGradient>
    <linearGradient id="ms-s1-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Right Screen (Workstation B - Elevated Target) -->
    <linearGradient id="ms-s2-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C3563"/>
      <stop offset="60%" stop-color="#112242"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>
    <linearGradient id="ms-s2-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Flowing Stream: Electric Cyan -> Royal Azure -> Vivid Violet -->
    <linearGradient id="ms-stream" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- 1. Master Windows 11 Squircle Base (432x432, 40px safe margin) -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#ms-bg)"/>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="url(#ms-tile-rim)" stroke-width="2"/>

  <!-- 2. Screen 1 (Left - Workstation A) -->
  <g id="screen-host">
    <rect x="88" y="192" width="216" height="146" rx="20" fill="url(#ms-s1-glass)" stroke="url(#ms-s1-rim)" stroke-width="3"/>
    <!-- Fluent Specular Top Edge -->
    <path d="M 108 196 L 284 196" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 3. Screen 2 Vector Occlusion / Cutout Shadow Plate -->
  <!-- Creates crisp, clean separation without fuzzy SVG filter blurs -->
  <rect x="202" y="128" width="224" height="154" rx="24" fill="#03060E" opacity="0.85"/>

  <!-- 4. Screen 2 (Right - Workstation B, Elevated Target) -->
  <g id="screen-client">
    <rect x="208" y="134" width="216" height="146" rx="20" fill="url(#ms-s2-glass)" stroke="url(#ms-s2-rim)" stroke-width="3"/>
    <!-- Fluent Specular Top Edge -->
    <path d="M 228 138 L 404 138" stroke="#00F0FF" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 5. Flowing Connection Line (Bold 24px Conduit) -->
  <g id="connection-line">
    <path d="M 148 268 C 196 304 238 166 368 204" fill="none" stroke="url(#ms-stream)" stroke-width="24" stroke-linecap="round"/>
    <!-- Solid Grounded Terminal Nodes -->
    <circle cx="148" cy="268" r="9" fill="#00F0FF"/>
    <circle cx="368" cy="204" r="9" fill="#A855F7"/>
  </g>

  <!-- 6. Hero White Mouse Cursor (Northwest -15° Angle at Gateway) -->
  <g id="cursor-hero" transform="translate(240, 190) rotate(-15)">
    <!-- High-Contrast Obsidian Outer Shield -->
    <path d="M 0 0 L 0 88 L 22 66 L 44 110 L 64 100 L 42 56 L 76 56 Z" fill="#020409" stroke="#020409" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Pure White Hero Pointer -->
    <path d="M 0 0 L 0 88 L 22 66 L 44 110 L 64 100 L 42 56 L 76 56 Z" fill="#FFFFFF"/>
    <!-- Fluent Specular Sheen (Left Facet) -->
    <path d="M 0 0 L 0 72 L 18 54 L 0 0 Z" fill="#F1F5F9" opacity="0.9"/>
  </g>
</svg>